[package]
name = "supabase-iceberg-example"
version = "0.1.0"
edition = "2024"

[dependencies]
etl = { workspace = true }
etl-destinations = { workspace = true, features = ["supabase-iceberg"] }
etl-postgres = { workspace = true }

tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-postgres = { workspace = true }
tracing = { workspace = true, default-features = true }
tracing-subscriber = { workspace = true, default-features = true, features = ["env-filter"] }
chrono = { workspace = true, features = ["serde"] }
dotenv = "0.15"
url = "2.4"
iceberg = "0.6"

[[example]]
name = "supabase_pipeline"
path = "supabase_pipeline.rs"
required-features = ["etl-destinations/supabase-iceberg"]

[[example]]
name = "query_table"
path = "query_table.rs"
required-features = ["etl-destinations/supabase-iceberg"]

[[example]]
name = "test_transaction_writes"
path = "test_transaction_writes.rs"
required-features = ["etl-destinations/supabase-iceberg"]

[[example]]
name = "test_insert_operations"
path = "test_insert_operations.rs"
required-features = ["etl-destinations/supabase-iceberg"]

[[example]]
name = "cleanup_namespaces"
path = "cleanup_namespaces.rs"
required-features = ["etl-destinations/supabase-iceberg"]

[[example]]
name = "test_update_operations"
path = "test_update_operations.rs"
required-features = ["etl-destinations/supabase-iceberg"]

[[example]]
name = "test_delete_operations"
path = "test_delete_operations.rs"
required-features = ["etl-destinations/supabase-iceberg"]

[[example]]
name = "force_cleanup_namespaces"
path = "force_cleanup_namespaces.rs"
required-features = ["etl-destinations/supabase-iceberg"]

[[example]]
name = "debug_echo_namespace"
path = "debug_echo_namespace.rs"
required-features = ["etl-destinations/supabase-iceberg"]

